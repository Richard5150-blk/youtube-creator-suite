version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: youtube_suite_db
    environment:
      POSTGRES_USER: ${DB_USER:-youtube_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-youtube_suite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-youtube_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: youtube_suite_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube_suite_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-youtube_user}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-youtube_suite}
      REDIS_URL: redis://redis:6379
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: youtube_suite_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

  # Video Processor Service
  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: youtube_suite_processor
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER:-youtube_user}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-youtube_suite}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./video-processor:/app
      - ./uploads:/app/uploads
      - ./renders:/app/renders
    command: python -m src.worker

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: youtube_suite_ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./ai-service:/app
    command: python -m src.worker

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: youtube_suite_network
